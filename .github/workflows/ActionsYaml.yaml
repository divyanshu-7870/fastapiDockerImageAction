name: Docker image build

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt

      - name: Run automated tests
        run: |
          python automationTesting.py

      - name: Login to DockerHub
        run: |
          echo "${{ secrets.DOCKERTOKEN }}" | docker login -u "${{ secrets.DOCKERUSERNAME }}" --password-stdin

      - name: Build Docker Image
        run: |
          docker build -t ${{ secrets.DOCKERUSERNAME }}/notes-app:v0.1 .

      - name: Push Docker Image
        run: |
          docker push ${{ secrets.DOCKERUSERNAME }}/notes-app:v0.1
